name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: 'OrangeFox Branch (e.g. 9.0)'
        required: true
        default: '9.0'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Environment & Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc rsync

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize OrangeFox Source
      run: |
        git config --global user.name "GitHub Actions Build Bot"
        git config --global user.email "actions@github.com"
        mkdir workspace && cd workspace
        repo init -u https://gitlab.com/OrangeFox/Manifest.git -b ${{ github.event.inputs.BRANCH }}
        repo sync --depth=1 --no-tags --no-clone-bundle -j$(nproc)

    - name: Inject Device Tree
      run: |
        cd workspace
        mkdir -p device/tecno/lc6
        cp -r $GITHUB_WORKSPACE/* device/tecno/lc6/

    - name: Start Compilation
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch fox_lc6-eng
        mka recoveryimage

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-LC6-Recovery
        path: workspace/out/target/product/lc6/*.img
